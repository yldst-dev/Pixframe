name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mobile
      - run: npm run build:native
        working-directory: mobile
      - env:
          PIXFRAME_ANDROID_KEYSTORE_BASE64: ${{ secrets.PIXFRAME_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$PIXFRAME_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixframe-upload.jks"
      - run: ./gradlew assembleRelease -PPIXFRAME_VERSION_NAME="${GITHUB_REF_NAME#v}" -PPIXFRAME_VERSION_CODE="$GITHUB_RUN_NUMBER"
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_PIXFRAME_UPLOAD_STORE_FILE: ${{ runner.temp }}/pixframe-upload.jks
          ORG_GRADLE_PROJECT_PIXFRAME_UPLOAD_STORE_PASSWORD: ${{ secrets.PIXFRAME_ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PIXFRAME_UPLOAD_KEY_ALIAS: ${{ secrets.PIXFRAME_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PIXFRAME_UPLOAD_KEY_PASSWORD: ${{ secrets.PIXFRAME_ANDROID_KEY_PASSWORD }}
      - run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Pixframe-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            Pixframe-android.apk
  ios-altstore-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run build:native
        working-directory: mobile
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ios/build MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: mobile
      - run: |
          tmp="$(mktemp -d ios/build/ipa.XXXXXX)"
          mkdir -p "$tmp/Payload"
          cp -R ios/build/Build/Products/Release-iphoneos/App.app "$tmp/Payload/App.app"
          ditto -c -k --sequesterRsrc --keepParent "$tmp/Payload" "$GITHUB_WORKSPACE/Pixframe-altstore.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-altstore-release
          path: Pixframe-altstore.ipa
  github-release:
    runs-on: ubuntu-latest
    needs:
      - android-release
      - ios-altstore-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-altstore-release
          path: release-assets/ios
      - run: cp mobile/icon.png release-assets/Pixframe-icon.png
      - run: node scripts/generate-altstore-source.mjs "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER" release-assets/ios/Pixframe-altstore.ipa release-assets/altstore-source.json
      - run: |
          printf '%s\n\n' 'AltStore Source' > release-assets/release-notes.md
          printf '%s\n\n' "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore-source.json" >> release-assets/release-notes.md
          printf '%s\n' 'Assets:' >> release-assets/release-notes.md
          printf '%s\n' '- Pixframe-android.apk' >> release-assets/release-notes.md
          printf '%s\n' '- Pixframe-altstore.ipa' >> release-assets/release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/release-notes.md
          overwrite_files: true
          files: |
            release-assets/android/Pixframe-android.apk
            release-assets/ios/Pixframe-altstore.ipa
            release-assets/Pixframe-icon.png
            release-assets/altstore-source.json
